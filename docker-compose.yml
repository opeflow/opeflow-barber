services:
  aplicacao:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - dependencias_php:/var/www/html/vendor
    ports:
      - "8000:8000"
    depends_on:
      banco:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  fila:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - dependencias_php:/var/www/html/vendor
    depends_on:
      banco:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan horizon

  agendador:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - dependencias_php:/var/www/html/vendor
    depends_on:
      banco:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan schedule:work

  inicializar:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - dependencias_php:/var/www/html/vendor
    depends_on:
      banco:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "composer install &&
      php artisan key:generate --force &&
      php artisan migrate --force"
    profiles: ["inicializacao"]

  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opeflow_barber
      POSTGRES_USER: opeflow
      POSTGRES_PASSWORD: secret
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./docker/postgres/01-criar-banco-de-testes.sql:/docker-entrypoint-initdb.d/01-criar-banco-de-testes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opeflow -d opeflow_barber"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    expose:
      - "1025"

volumes:
  dados_postgres:
  dependencias_php:
  node_modules:
